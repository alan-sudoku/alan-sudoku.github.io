name: Sync content from source repos

on:
  schedule:
    - cron: '0 * * * *'  # hourly
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Pages repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout SIRC
        uses: actions/checkout@v4
        with:
          repository: alan-sudoku/SIRC
          path: _source_sirc

      - name: Checkout entropic_compact
        uses: actions/checkout@v4
        with:
          repository: alan-sudoku/entropic_compact
          path: _source_ec

      - name: Checkout argument_structure_audit
        uses: actions/checkout@v4
        with:
          repository: alan-sudoku/argument_structure_audit
          path: _source_asa

      - name: Checkout geometric_sufficiency_hypothesis
        uses: actions/checkout@v4
        with:
          repository: alan-sudoku/geometric_sufficiency_hypothesis
          path: _source_gsh

      - name: Sync content
        run: |
          mkdir -p content/SIRC
          rsync -av --delete \
            --exclude='.github' --exclude='.git' --exclude='LICENSE' \
            --exclude='archived/' --exclude='.DS_Store' --exclude='.gitignore' \
            _source_sirc/ content/SIRC/

          mkdir -p content/entropic_compact
          rsync -av --delete \
            --exclude='.github' --exclude='.git' --exclude='LICENSE' \
            --exclude='archived/' --exclude='.DS_Store' --exclude='.gitignore' \
            _source_ec/ content/entropic_compact/

          mkdir -p content/argument_structure_audit
          rsync -av --delete \
            --exclude='.github' --exclude='.git' --exclude='LICENSE' \
            --exclude='archived/' --exclude='tools/' \
            --exclude='.DS_Store' --exclude='.gitignore' \
            _source_asa/ content/argument_structure_audit/

          mkdir -p content/gsh
          rsync -av --delete \
            --exclude='.github' --exclude='.git' --exclude='LICENSE' \
            --exclude='archived/' --exclude='tools/' --exclude='local_docs/' --exclude='local_tools/' \
            --exclude='.DS_Store' --exclude='.gitignore' \
            _source_gsh/ content/gsh/

      - name: Commit and push
        run: |
          printf -- '---\ntitle: Substrate-Independent Reasoning Communication (SIRC)\n---\n' > content/SIRC/index.md
          printf -- '---\ntitle: Geometric Sufficiency Hypothesis (GSH)\n---\n' > content/gsh/index.md
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/
          git diff --cached --quiet || git commit -m "sync: content from source repos"
          git push
